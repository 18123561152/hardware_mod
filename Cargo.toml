[workspace]
resolver = "2"
members = [
    "crates/burncloud-hardware-probe",
    "crates/burncloud-metrics-probe",
]

[package]
name = "hardware-probe-whitebox"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hardware-probe-whitebox"
path = "main.rs"

[dependencies]
burncloud-hardware-probe = { path = "crates/burncloud-hardware-probe" }
burncloud-metrics-probe = { path = "crates/burncloud-metrics-probe" }
burncloud-node-runtime = { git = "https://github.com/burncloud/burncloud.git", rev = "731ac0d92058dc45d7c8e3e0a71c04cb037cb528" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
