[package]
name = "burncloud-hardware-probe"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1"
burncloud-node-runtime = { git = "https://github.com/burncloud/burncloud.git", rev = "731ac0d92058dc45d7c8e3e0a71c04cb037cb528" }
tokio = { version = "1", features = ["process", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
